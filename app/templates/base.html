<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>{% block title %}Wardrobe AI{% endblock %}</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wardrobe AI" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- App styles -->
  <link href="/static/css/app.css?v=3" rel="stylesheet" />
</head>
<body x-data="appShell()" x-init="init()">

  <!-- Top app bar -->
  <header class="app-bar">
    <div class="app-bar-inner">
      <a href="/" class="brand">
        <i class="bi bi-hanger"></i>
        <span>Wardrobe AI</span>
      </a>
      <div class="user-switch">
        <select class="form-select form-select-sm" x-ref="userSelect"
                @change="onUserChange($event.target.value)"
                x-html="userOptionsHtml()"></select>
      </div>
    </div>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar">
    <a href="/" class="tab {% if active == 'home' %}active{% endif %}">
      <i class="bi bi-house-door"></i><span>Home</span>
    </a>
    <a href="/wardrobe" class="tab {% if active == 'wardrobe' %}active{% endif %}">
      <i class="bi bi-grid"></i><span>Wardrobe</span>
    </a>
    <a href="/add" class="tab tab-add {% if active == 'add' %}active{% endif %}">
      <i class="bi bi-plus-lg"></i><span>Add</span>
    </a>
    <a href="/history" class="tab {% if active == 'history' %}active{% endif %}">
      <i class="bi bi-clock-history"></i><span>History</span>
    </a>
    <a href="/profile" class="tab {% if active == 'profile' %}active{% endif %}">
      <i class="bi bi-person"></i><span>Profile</span>
    </a>
  </nav>

  <!-- Toast -->
  <div class="toast-wrap" x-show="toast.show" x-transition style="display:none;">
    <div class="toast-box" :class="toast.type" x-text="toast.msg"></div>
  </div>

  <!-- Confirm dialog (Bootstrap modal look, Alpine-driven) -->
  <div class="modal-backdrop-wa" x-show="confirmDlg.show" x-cloak
       @click.self="closeConfirm(false)" @keydown.escape.window="if (confirmDlg.show) closeConfirm(false)">
    <div class="wa-confirm" @click.stop>
      <div class="wa-confirm-head">
        <h5 x-text="confirmDlg.title"></h5>
        <button type="button" class="btn-close" @click="closeConfirm(false)" aria-label="Close"></button>
      </div>
      <p class="wa-confirm-msg" x-text="confirmDlg.message"></p>
      <div class="wa-confirm-actions">
        <button type="button" class="btn btn-outline-secondary" @click="closeConfirm(false)">Cancel</button>
        <button type="button" class="btn btn-danger" @click="closeConfirm(true)" x-text="confirmDlg.confirmLabel"></button>
      </div>
    </div>
  </div>

  <script>
    const OUTFIT_COUNT = {{ outfit_count }};
  </script>
  <script src="/static/js/app.js?v=3"></script>
  <!-- Alpine.js (after app.js so component factories are registered) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <!-- Register the service worker (PWA / installable) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
