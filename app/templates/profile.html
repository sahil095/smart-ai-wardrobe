{% extends "base.html" %}
{% block title %}Wardrobe AI — Profile{% endblock %}

{% block content %}
<div x-data="profilePage()" x-init="init()">
  <div class="section-title">Profile</div>
  <p class="muted small" x-show="username">Signed in as <b x-text="username"></b></p>

  <form class="card-soft" @submit.prevent="save()">
    <div class="section-title" x-text="form.id ? 'Edit profile' : 'Create profile'"></div>

    <div class="row g-2">
      <div class="col-8">
        <label class="form-label">Full Name *</label>
        <input class="form-control" x-model="form.name" required maxlength="120" />
      </div>
      <div class="col-4">
        <label class="form-label">Nickname</label>
        <input class="form-control" x-model="form.nickname" />
      </div>
      <div class="col-4">
        <label class="form-label">Age</label>
        <input type="number" class="form-control" x-model.number="form.age" min="0" max="130" />
      </div>
      <div class="col-8">
        <label class="form-label">Gender</label>
        <select class="form-select" x-model="form.gender">
          <option value="">—</option>
          <template x-for="g in opts.genders"><option x-text="g"></option></template>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Height</label>
        <input class="form-control" x-model="form.height" placeholder="e.g. 5'10 / 178cm" />
      </div>
      <div class="col-6">
        <label class="form-label">Weight</label>
        <input class="form-control" x-model="form.weight" placeholder="e.g. 72kg" />
      </div>
    </div>

    <div class="divider"></div>

    <div class="row g-2">
      <div class="col-6">
        <label class="form-label">Body Type</label>
        <select class="form-select" x-model="form.body_type">
          <option value="">—</option>
          <template x-for="b in opts.body_types"><option x-text="b"></option></template>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Skin Tone</label>
        <select class="form-select" x-model="form.skin_tone">
          <option value="">—</option>
          <template x-for="s in opts.skin_tones"><option x-text="s"></option></template>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Undertone</label>
        <select class="form-select" x-model="form.undertone">
          <option value="">—</option>
          <template x-for="u in opts.undertones"><option x-text="u"></option></template>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Hair Color</label>
        <select class="form-select" x-model="form.hair_color">
          <option value="">—</option>
          <template x-for="h in opts.hair_colors"><option x-text="h"></option></template>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Eye Color</label>
        <select class="form-select" x-model="form.eye_color">
          <option value="">—</option>
          <template x-for="e in opts.eye_colors"><option x-text="e"></option></template>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Default Shoe Size</label>
        <input class="form-control" x-model="form.default_shoe_size" placeholder="e.g. UK 9" />
      </div>
    </div>

    <div class="divider"></div>

    <label class="form-label">Preferred Fit</label>
    <div class="chip-group mb-2">
      <template x-for="f in opts.preferred_fits" :key="f">
        <span class="chip" :class="{selected: form.preferred_fit === f}" @click="form.preferred_fit = f" x-text="f"></span>
      </template>
    </div>

    <label class="form-label">Fashion Style (multiple)</label>
    <div class="chip-group mb-2">
      <template x-for="s in opts.fashion_styles" :key="s">
        <span class="chip" :class="{selected: form.style.includes(s)}" @click="toggleInArray(form.style, s)" x-text="s"></span>
      </template>
    </div>

    <div class="row g-2">
      <div class="col-6">
        <label class="form-label">Favorite Colors</label>
        <input class="form-control" :value="form.favorite_colors.join(', ')"
               @input="form.favorite_colors = splitCsv($event.target.value)"
               placeholder="navy, white, olive" />
      </div>
      <div class="col-6">
        <label class="form-label">Disliked Colors</label>
        <input class="form-control" :value="form.disliked_colors.join(', ')"
               @input="form.disliked_colors = splitCsv($event.target.value)"
               placeholder="neon, orange" />
      </div>
    </div>

    <label class="form-label mt-2">Notes</label>
    <textarea class="form-control" rows="2" x-model="form.notes"></textarea>

    <template x-if="form.id && memories.length">
      <div class="mt-3">
        <div class="section-title">Style memory</div>
        <p class="muted small">Preferences you told the stylist. Generate uses these too.</p>
        <template x-for="(mem, idx) in memories" :key="idx">
          <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
            <span x-text="mem.text"></span>
            <button type="button" class="btn btn-sm btn-outline-danger" title="Forget this preference" @click="forget(idx)">Delete</button>
          </div>
        </template>
      </div>
    </template>

    <div class="mt-3">
      <div class="section-title">Password</div>
      <label class="form-label">Current password</label>
      <input class="form-control" type="password" x-model="currentPassword" autocomplete="current-password" />
      <label class="form-label mt-2">New password</label>
      <input class="form-control" type="password" x-model="nextPassword" autocomplete="new-password" />
      <button type="button" class="btn btn-outline-primary mt-2" title="Save a new password" @click="changePassword()" :disabled="saving">
        Update password
      </button>
    </div>

    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-gradient flex-fill" title="Save profile" :disabled="saving">
        <span x-text="form.id ? 'Update' : 'Save'"></span>
      </button>
      <template x-if="form.id">
        <button type="button" class="btn btn-outline-danger" title="Delete User" @click="remove()"><i class="bi bi-trash"></i></button>
      </template>
      <button type="button" class="btn btn-outline-secondary" title="Discard changes and go home" @click="location.href = '/'">Cancel</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
function blankUser() {
  return {
    id: null, name: "", nickname: "", age: null, gender: "", height: "", weight: "",
    body_type: "", skin_tone: "", undertone: "", hair_color: "", eye_color: "",
    preferred_fit: "", style: [], favorite_colors: [], disliked_colors: [],
    default_shoe_size: "", notes: "",
  };
}
function profilePage() {
  return {
    opts: {}, username: "", form: blankUser(), memories: [], saving: false,
    currentPassword: "", nextPassword: "",
    toggleInArray,
    splitCsv(v) { return v.split(",").map(s => s.trim()).filter(Boolean); },
    async init() {
      this.opts = await WA.get("/api/meta/options");
      const me = await WA.get("/api/auth/me");
      WA.setUserId(me.id);
      this.username = me.username || "";
      const u = me;
      this.form = Object.assign(blankUser(), u);
      this.form.style = u.style || [];
      this.form.favorite_colors = u.favorite_colors || [];
      this.form.disliked_colors = u.disliked_colors || [];
      this.memories = u.style_memories || [];
    },
    async save() {
      this.saving = true;
      try {
        const payload = { ...this.form };
        delete payload.created_at; delete payload.updated_at; delete payload.style_memories;
        delete payload.username;
        const saved = await WA.put(`/api/users/${this.form.id}`, payload);
        waToast("Profile saved", "success");
        this.form = Object.assign(blankUser(), saved);
        setTimeout(() => location.reload(), 700);
      } catch (e) { waToast(e.message, "error"); }
      finally { this.saving = false; }
    },
    async changePassword() {
      if (!this.currentPassword || !this.nextPassword) {
        waToast("Enter the current password and a new one", "error");
        return;
      }
      this.saving = true;
      try {
        await WA.post("/api/auth/password", {
          current_password: this.currentPassword,
          new_password: this.nextPassword,
        });
        this.currentPassword = "";
        this.nextPassword = "";
        waToast("Password updated", "success");
      } catch (e) { waToast(e.message, "error"); }
      finally { this.saving = false; }
    },
    async remove() {
      const ok = await waConfirm({
        title: "Delete profile?",
        message: "This will delete this profile and all of its wardrobe items. This cannot be undone.",
        confirmLabel: "Delete profile",
      });
      if (!ok) return;
      try {
        await WA.del(`/api/users/${this.form.id}`);
        WA.setUserId(null);
        waToast("Profile deleted", "success");
        setTimeout(() => { location.href = "/login"; }, 600);
      } catch (e) { waToast(e.message, "error"); }
    },
    async forget(idx) {
      const ok = await waConfirm({
        title: "Forget this?",
        message: "The stylist and generator will stop using this preference.",
        confirmLabel: "Delete",
      });
      if (!ok) return;
      try {
        await WA.del(`/api/users/${this.form.id}/memories/${idx}`);
        const u = await WA.get("/api/auth/me");
        this.memories = u.style_memories || [];
        waToast("Forgotten", "success");
      } catch (e) { waToast(e.message, "error"); }
    },
  };
}
</script>
{% endblock %}
