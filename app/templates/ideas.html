{% extends "base.html" %}
{% block title %}Wardrobe AI — Style ideas{% endblock %}

{% block content %}
<div x-data="ideasPage()" x-init="init()">
  <div class="section-title"><i class="bi bi-images"></i> Style ideas</div>
  <p class="muted small">Similar looks for the kind of piece you own. Not your photo, and nothing to buy.</p>

  <template x-if="!hasUser">
    <div class="card-soft empty-state">
      {% include "_hanger.html" %}
      <p>Create a profile first.</p>
      <a href="/profile" class="btn btn-primary">Go to Profile</a>
    </div>
  </template>

  <div class="spinner-wrap" x-show="loading"><div class="spinner-border text-primary"></div></div>

  <template x-if="hasUser && !loading && result">
    <div>
      <p class="small" x-show="result.note" x-text="result.note"></p>
      <div class="pin-stack" x-show="result.query || (result.photos || []).length">
        <div class="pin-card">
          <p>Find styles for your “<span x-text="styleLabel(result)"></span>” on Pixabay.</p>
          <div class="idea-grid" x-show="(result.photos || []).length">
            <template x-for="(photo, i) in (result.photos || []).slice(0, 6)" :key="i">
              <a :href="photo.source_url" target="_blank" rel="noopener">
                <img :src="photo.image_url" :alt="photo.alt" @error="waOnImgError($event)" />
              </a>
            </template>
          </div>
          <a class="btn btn-primary w-100" title="Open this search on Pixabay" :href="result.pixabay_url" target="_blank" rel="noopener">
            Open Pixabay
          </a>
        </div>
        <div class="pin-card">
          <p>Find styles for your “<span x-text="styleLabel(result)"></span>” on Pinterest.</p>
          <a class="btn btn-primary w-100" title="Open this search on Pinterest" :href="result.pinterest_url" target="_blank" rel="noopener">
            Open Pinterest
          </a>
        </div>
      </div>
    </div>
  </template>
</div>
{% endblock %}

{% block scripts %}
<script>
function ideasPage() {
  return {
    hasUser: false, loading: false, result: null,
    styleLabel(result) {
      return String((result && (result.query || "")) || "this piece").replace(/\s+outfit$/i, "");
    },
    async init() {
      const uid = WA.getUserId();
      this.hasUser = !!uid;
      if (!uid) return;
      const params = new URLSearchParams(location.search);
      const itemId = params.get("item_id");
      const query = params.get("q") || "";
      if (!itemId && !query) {
        this.result = { query: "", photos: [], pinterest_url: "https://www.pinterest.com/search/pins/?q=outfit+ideas", pixabay_url: "https://pixabay.com/images/search/outfit%20ideas/", note: "Pick an item from your wardrobe." };
        return;
      }
      this.loading = true;
      try {
        const q = new URLSearchParams({ user_id: uid });
        if (itemId) q.set("item_id", itemId);
        if (query) q.set("query", query);
        this.result = await WA.get(`/api/style-ideas?${q.toString()}`);
      } catch (e) { waToast(e.message, "error"); }
      finally { this.loading = false; }
    },
  };
}
</script>
{% endblock %}
