{% extends "base.html" %}
{% block title %}Wardrobe AI — Gaps{% endblock %}

{% block content %}
<div x-data="gapsPage()" x-init="init()">
  <div class="d-flex justify-content-between align-items-start gap-2">
    <div>
      <div class="section-title mb-1"><i class="bi bi-diagram-3"></i> Wardrobe gaps</div>
      <p class="muted small mb-0">Missing staples and color holes, based on the tags you already store. No shop links.</p>
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary" @click="load(true)" :disabled="loading || !hasUser">
      <i class="bi bi-arrow-repeat"></i> Refresh analysis
    </button>
  </div>

  <template x-if="!hasUser">
    <div class="card-soft empty-state mt-3">
      <i class="bi bi-person-x"></i>
      <p>Create a profile first.</p>
      <a href="/profile" class="btn btn-primary">Go to Profile</a>
    </div>
  </template>

  <div class="spinner-wrap" x-show="loading"><div class="spinner-border text-primary"></div></div>

  <template x-if="hasUser && !loading && cards.length === 0">
    <div class="empty-state">
      <i class="bi bi-bag-plus"></i>
      <p>Add more tagged items for a useful analysis.</p>
      <a href="/add" class="btn btn-primary">Add an item</a>
    </div>
  </template>

  <p class="muted small mt-3 mb-2" x-show="!loading && cards.length && metaNote" x-text="metaNote"></p>

  <template x-for="(card, idx) in cards" :key="idx">
    <div class="gap-card" :class="'sev-' + card.severity">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <b x-text="card.title"></b>
        <span class="sev-pill" x-text="card.severity"></span>
      </div>
      <p class="mb-1" x-show="card.why" x-text="card.why"></p>
      <p class="mb-0 muted" x-show="card.suggestion"><span class="lbl">Try: </span><span x-text="card.suggestion"></span></p>
    </div>
  </template>
</div>
{% endblock %}

{% block scripts %}
<script>
function gapsPage() {
  return {
    hasUser: false, loading: false, cards: [], metaNote: "",
    async init() {
      const uid = WA.getUserId();
      this.hasUser = !!uid;
      if (!uid) return;
      await this.load(false);
    },
    async load(refresh) {
      const uid = WA.getUserId();
      this.loading = true;
      try {
        const q = refresh ? "&refresh=true" : "";
        const data = await WA.get(`/api/wardrobe/gaps?user_id=${uid}${q}`);
        this.cards = data.cards || [];
        const bits = [];
        if (data.used_ai) bits.push("AI analysis");
        else if (this.cards.length) bits.push("Rule-based analysis");
        if (data.cached) bits.push("cached");
        this.metaNote = bits.join(" · ");
      } catch (e) { waToast(e.message, "error"); }
      finally { this.loading = false; }
    },
  };
}
</script>
{% endblock %}
